plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = project.version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

sourceSets {
	// GameTests live in their own mod so they never ship in the release jar.
	gametest {
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
	}
}

repositories {
	mavenCentral()
	// WorldEdit (optional integration)
	maven { url = 'https://maven.enginehub.org/repo/' }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"mcmcp" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		"mcmcp-gametest" {
			sourceSet sourceSets.gametest
		}
	}

	runs {
		// ./gradlew runGametest ¡ª headless server that runs every @GameTest and exits.
		gametest {
			server()
			name "Game Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest/junit.xml"
			runDir "build/gametest"
			source sourceSets.gametest
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Java-WebSocket only depends on slf4j-api, which Minecraft already ships.
	implementation("org.java-websocket:Java-WebSocket:${project.java_websocket_version}") {
		transitive = false
	}
	include("org.java-websocket:Java-WebSocket:${project.java_websocket_version}")

	// Optional: schematic files and WorldEdit patterns when WorldEdit is installed.
	// Compile against it, and run with it in dev (runClient / runServer / runGametest).
	modCompileOnly "com.sk89q.worldedit:worldedit-fabric-mc1.21:${project.worldedit_version}"
	modLocalRuntime "com.sk89q.worldedit:worldedit-fabric-mc1.21:${project.worldedit_version}"

	// Build-script sandbox (stage 3). No transitive dependencies.
	implementation "org.mozilla:rhino:${project.rhino_version}"
	include "org.mozilla:rhino:${project.rhino_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
